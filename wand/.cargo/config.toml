[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

[env]
ESP_LOG = "info"

[unstable]
# alloc as well as core: the radio stack (esp-radio) needs a heap, so its
# dependencies pull in `alloc` even though our own code stays allocation-free.
build-std = ["core", "alloc"]