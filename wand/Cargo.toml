[package]
name = "fils-project"
version = "0.1.0"
edition = "2021"

[dependencies]
# ESP32-S3 Hardware Abstraction Layer
esp-hal = { version = "1.1.0", features = ["esp32s3", "unstable"] }

# Panic handler for ESP32-S3
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }

# Serial println! macro for ESP32-S3
esp-println = { version = "0.17.0", features = ["esp32s3"] }

# Required by espflash 4.4.0+
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

# TinyML inference engine. Optional, because the `spells` binary needs a trained
# model file to exist at compile time - the model! macro reads it during the build.
microflow = { version = "0.1.3", optional = true }

# The model! macro expands to code that names nalgebra directly, so it has to be
# a direct dependency of this crate too. no_std needs libm for the float maths.
nalgebra = { version = "0.32", default-features = false, features = ["libm"], optional = true }

# Radio, for broadcasting the cast spell to the controller over ESP-NOW.
# Optional so the recogniser can be built and tested without it.
#
# esp-radio rather than the older esp-wifi: esp-wifi 0.15 pins xtensa-lx-rt 0.20
# while esp-hal 1.1 needs 0.22, and that crate uses `links`, so only one version
# can exist in a build. esp-radio is the esp-hal 1.1 line of the same driver.
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "esp-now", "unstable"], optional = true }
# The `esp-radio` feature is what makes esp-rtos provide the scheduler symbols
# the radio driver expects; without it the link fails on esp_rtos_* references.
esp-rtos = { version = "0.3.0", features = ["esp32s3", "esp-radio", "esp-alloc"], optional = true }
esp-alloc = { version = "0.10.0", optional = true }

[features]
# Enables the neural-network spell recogniser. Requires model/spells.tflite.
ml = ["dep:microflow", "dep:nalgebra"]

# Broadcasts each recognised spell over ESP-NOW.
radio = ["dep:esp-radio", "dep:esp-rtos", "dep:esp-alloc"]

# Broadcasts each spell once at startup, without needing a gesture. For testing
# the link and everything downstream of it - never enable this in normal use, as
# the controller will act on the spells as if they had been cast.
selftest = ["radio"]

# Only built with --features ml, so a missing model never breaks `cargo build`.
[[bin]]
name = "spells"
required-features = ["ml"]

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"

[profile.dev]
debug = true
opt-level = "z"
